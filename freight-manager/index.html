<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FreightManager — управление перевозками</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <span class="eyebrow">PET‑ПРОЕКТ</span>
        <h1>FreightManager</h1>
        <p>Управление заявками на перевозку с автоматическим расчётом стоимости.</p>
      </div>
      <button id="resetBtn" class="ghost">Сбросить демо</button>
    </header>

    <section class="summary" id="summary"></section>

    <section class="workspace">
      <aside class="panel">
        <div class="panelHead">
          <span class="eyebrow">НОВАЯ ЗАЯВКА</span>
          <h2>Рассчитать перевозку</h2>
        </div>

        <form id="orderForm">
          <label>Клиент
            <input id="client" required placeholder="Например, Альфа ООО">
          </label>

          <label>Маршрут
            <input id="route" required placeholder="Москва → Казань">
          </label>

          <div class="two">
            <label>Расстояние, км
              <input id="distance" type="number" min="1" value="500" required>
            </label>
            <label>Вес, кг
              <input id="weight" type="number" min="1" value="1000" required>
            </label>
          </div>

          <div class="two">
            <label>Ставка, ₽/км
              <input id="rate" type="number" min="1" step="0.1" value="42" required>
            </label>
            <label>Тип доставки
              <select id="priority">
                <option value="1">Стандарт</option>
                <option value="1.15">Приоритет (+15%)</option>
                <option value="1.3">Экспресс (+30%)</option>
              </select>
            </label>
          </div>

          <label class="check">
            <input id="insurance" type="checkbox">
            <span>Страхование груза (+1.2%)</span>
          </label>

          <div class="estimate">
            <span>Расчётная стоимость</span>
            <strong id="estimate">—</strong>
          </div>

          <button type="submit">Добавить заявку</button>
        </form>
      </aside>

      <section class="content">
        <div class="filters">
          <input id="search" type="search" placeholder="Поиск по клиенту или маршруту">
          <select id="statusFilter">
            <option value="all">Все статусы</option>
            <option value="new">Новая</option>
            <option value="planned">Запланирована</option>
            <option value="route">В рейсе</option>
            <option value="done">Доставлено</option>
          </select>
          <select id="sort">
            <option value="newest">Сначала новые</option>
            <option value="costDesc">Стоимость ↓</option>
            <option value="costAsc">Стоимость ↑</option>
            <option value="distanceDesc">Расстояние ↓</option>
          </select>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>№</th>
                <th>Клиент</th>
                <th>Маршрут</th>
                <th>Км</th>
                <th>Вес</th>
                <th>Стоимость</th>
                <th>Статус</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="empty" class="empty" hidden>По заданным условиям заявок нет.</div>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
